name: OCI Compute Instance Capacity Hunter

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 */6 * * *' 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'

      - name: Install dependencies
        run: composer install

      - name: Create Private Key File
        run: |
          cat << 'EOF' > private_key.pem
          ${{ secrets.OCI_PRIVATE_KEY }}
          EOF

      - name: Debug Shape Config
        run: |
          echo "OCPU length: ${#OCI_OCPU_COUNT}"
          echo "OCPU value: $OCI_OCPU_COUNT"
          echo "MEM length: ${#OCI_MEMORY_IN_GBS}"
          echo "MEM value: $OCI_MEMORY_IN_GBS"
          echo "SHAPE value: $OCI_SHAPE"
        env:
          OCI_OCPU_COUNT: ${{ secrets.OCI_OCPU_COUNT }}
          OCI_MEMORY_IN_GBS: ${{ secrets.OCI_MEMORY_IN_GBS }}
          OCI_SHAPE: ${{ secrets.OCI_SHAPE }}
          
      - name: Run Capacity Hunter
        run: php index.php
        env:
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
          OCI_KEY_FINGERPRINT: ${{ secrets.OCI_KEY_FINGERPRINT }}
          OCI_PRIVATE_KEY_FILENAME: private_key.pem
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
          OCI_OCPU_COUNT: ${{ secrets.OCI_OCPU_COUNT }}
          OCI_MEMORY_IN_GBS: ${{ secrets.OCI_MEMORY_IN_GBS }}
          OCI_SHAPE: ${{ secrets.OCI_SHAPE }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
